<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - User Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #ecfdf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }

        .login-card {
            position: relative;
            background: #ffffff;
            padding: 2.8rem 2.4rem;
            border-radius: 14px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .hero-icon {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #6366f1;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 24px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 8px;
            color: #64748b;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input::placeholder { color: #94a3b8; }

        .login-button {
            width: 100%;
            height: 46px;
            background-color: #6366f1;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .login-button:hover { background-color: #4f46e5; }

        /* Inline field error message */
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }
        
        .input-error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
        }

        /* Global error banner shown on failed login */
        .alert-banner {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        @media (max-width: 768px) {
            .login-card { padding: 2rem 1.25rem; max-width: 100%; }
            h1 { font-size: 17px; }
            input[type="text"], input[type="password"] { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="hero-icon"><i class="ti ti-heart-handshake"></i></div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to FRA Platform</p>

    <div id="globalError" class="alert-banner"></div>

    <form id="loginForm" action="/login" method="POST" novalidate>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username">
            <div id="usernameError" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password">
            <div id="passwordError" class="error-message"></div>
        </div>

        <button type="submit" class="login-button"><i class="ti ti-login"></i> Log In</button>

        <div style="margin-top:20px; padding:14px 16px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; color:#64748b; line-height:1.8;">
            <div style="font-weight:600; color:#475569; margin-bottom:6px;">Demo accounts</div>
            <div><span style="color:#94a3b8; display:inline-block; width:160px;">User Admin:</span> <code style="color:#0f172a;">admin1</code></div>
            <div><span style="color:#94a3b8; display:inline-block; width:160px;">Platform Management:</span> <code style="color:#0f172a;">pm1</code></div>
            <div><span style="color:#94a3b8; display:inline-block; width:160px;">Donee:</span> <code style="color:#0f172a;">donee1</code></div>
            <div><span style="color:#94a3b8; display:inline-block; width:160px;">Fund Raiser:</span> <code style="color:#0f172a;">raiser1</code></div>
            <div style="margin-top:6px; padding-top:6px; border-top:1px solid #e2e8f0;"><span style="color:#94a3b8; display:inline-block; width:160px;">Password (all):</span> <code style="color:#0f172a;">123</code></div>
        </div>
    </form>
</div>

<script>
    // 1. Intercept form submission and run client-side validation
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        let isValid = true;
        
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const globalError = document.getElementById('globalError');

        // Clear all error states before each submission
        usernameInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');
        usernameError.style.display = 'none';
        passwordError.style.display = 'none';
        globalError.style.display = 'none';

        // Validate username is not empty
        if (!usernameInput.value.trim()) {
            usernameError.textContent = "Please enter your username";
            usernameError.style.display = 'block';
            usernameInput.classList.add('input-error');
            isValid = false;
        }

        // Validate password: empty or shorter than 3 characters
        const pwdValue = passwordInput.value;
        if (!pwdValue) {
            passwordError.textContent = "Please enter your password";
            passwordError.style.display = 'block';
            passwordInput.classList.add('input-error');
            isValid = false;
        } else if (pwdValue.length < 3) {
            passwordError.textContent = "Password must be at least 3 characters";
            passwordError.style.display = 'block';
            passwordInput.classList.add('input-error');
            isValid = false;
        }

        // Prevent form submission if validation failed
        if (!isValid) {
            event.preventDefault();
        }
    });

    // 2. Handle server-side login errors returned via query param
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    if (error) {
        const globalError = document.getElementById('globalError');
        globalError.textContent = error;
        globalError.style.display = 'block';
        
        const cleanUrl = window.location.origin + "/LoginPage.html";
        window.history.replaceState({}, document.title, cleanUrl);
    }
</script>

</body>
</html>
