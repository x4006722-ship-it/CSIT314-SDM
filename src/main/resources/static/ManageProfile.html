<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Admin - Manage Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --surface-tint: #f1f5f9;
            --border: #f1f5f9;
            --border-soft: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --accent: #6366f1;
            --accent-dark: #4338ca;
            --accent-light: #eef2ff;
            --accent-ring: rgba(99, 102, 241, 0.2);
            --danger-bg: #fff1f2;
            --danger-text: #f43f5e;
            --danger-border: #fecdd3;
            --ok-bg: #dcfce7;
            --ok-text: #15803d;
            --ok-dot: #22c55e;
            --bad-bg: #fee2e2;
            --bad-text: #dc2626;
            --bad-dot: #ef4444;
            --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }

        body { min-height: 100vh; color: var(--text); background: #f8fafc; }

        .container { min-height: 100vh; }
        .main-content { padding: 20px; max-width: 1560px; margin: 0 auto; }

        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 16px 20px; border-radius: 14px;
            margin-bottom: 1.25rem; box-shadow: var(--shadow-card);
            border: 1px solid var(--border); border-left: 3px solid var(--accent);
        }

        .tab-bar { display: flex; gap: 4px; margin-bottom: 1rem; background: #f1f5f9; padding: 4px; border-radius: 8px; width: fit-content; }

        .tab-btn {
            padding: 8px 14px; border-radius: 6px; border: 1px solid transparent;
            background: transparent; cursor: pointer; font-weight: 500; font-size: 13px;
            transition: color .2s, background .2s, border-color .2s;
            color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
        }

        .tab-btn.active { background: #fff; color: var(--text); border-color: #e2e8f0; box-shadow: var(--shadow-card); }

        .admin-section {
            background: var(--surface); border-radius: 14px; padding: 1.25rem;
            margin-bottom: 1rem; box-shadow: var(--shadow-card); border: 1px solid var(--border);
        }

        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: .875rem; border-bottom: 1px solid var(--border); padding-bottom: .6rem; }
        .section-header::after { content: ''; width: 3px; height: 16px; border-radius: 99px; background: var(--accent); display: inline-block; }

        h2 { font-size: 16px; color: #334155; font-weight: 600; letter-spacing: .01em; }

        .action-bar { display: grid; grid-template-columns: 1fr; gap: 10px; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; height: 40px; padding: 0 10px; border: 1.5px solid var(--border-soft); border-radius: 8px; font-size: 14px; background: #f8fafc; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: transform .15s, box-shadow .2s, background .2s, color .2s; }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--accent); color: #fff; border: none; }
        .btn-view { background: transparent; color: var(--text-muted); border: 1px solid var(--border-soft); }
        .btn-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
        .btn-muted { background: transparent; color: var(--text-muted); border: 1px solid var(--border-soft); }

        .logout-btn { border: 1px solid var(--danger-border); color: var(--danger-text); background: var(--danger-bg); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }

        .pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
        .pill.ok { background: var(--ok-bg); color: var(--ok-text); }
        .pill.bad { background: var(--bad-bg); color: var(--bad-text); }

        .table-wrap { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: var(--shadow-card); }
        .table-scroll { max-height: 1000px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 980px; }
        #up-table { min-width: 0; }
        thead th { position: sticky; top: 0; z-index: 1; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-faint); padding: 11px 16px; text-align: left; }
        tbody td { padding: 11px 16px; border-bottom: 1px solid #f8fafc; font-size: 14px; color: #1e293b; vertical-align: middle; }
        
        .drawer-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; z-index: 999; }
        .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(520px, 92vw); background: #fff; box-shadow: var(--shadow-float); border-left: 3px solid var(--accent); transform: translateX(100%); transition: transform 0.18s ease; z-index: 1000; display: flex; flex-direction: column; }
        .drawer.open { transform: translateX(0); }
        .drawer-backdrop.open { display: block; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border-soft); background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%); }
        .drawer-body { padding: 18px; overflow: auto; display: grid; gap: 14px; }
        .drawer-footer { padding: 14px 18px; border-top: 1px solid var(--border-soft); display: flex; justify-content: flex-end; gap: 10px; background: #f8fafc; }

        .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; }
        .kv .k { color: var(--text-muted); font-size: 12px; }
        .kv .v { color: #1e293b; font-size: 14px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { min-width: 250px; padding: 15px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 600; opacity: 0; transform: translateX(100%); transition: all 0.3s ease; }
        .toast-msg.show { opacity: 1; transform: translateX(0); }
        .toast-success { background-color: #2ecc71; }
        .toast-error { background-color: #e74c3c; }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; z-index: 1300; }
        .modal { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); width: min(440px, 92vw); background: #fff; border-radius: 14px; display: none; z-index: 1310; }
        .modal.open { display: block; }
        .modal-header { padding: 16px 20px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; font-weight: 600; }
        .modal-body { padding: 24px 20px; text-align: center; }
        .modal-footer { padding: 0 20px 20px 20px; display: flex; justify-content: center; gap: 10px; }
        .subsection { padding: 1rem; border: 1px solid var(--border); border-radius: 14px; background: #f8fafc; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <main class="main-content">
        <div class="topbar">
            <span>Logged in as: <strong>User Admin</strong></span>
            <a href="/logout" class="logout-btn"><i class="ti ti-logout"></i> Logout</a>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active"><i class="ti ti-id-badge-2"></i> Manage Profile</button>
            <button class="tab-btn" onclick="location.href='ManageAccount.html'"><i class="ti ti-users"></i> Manage Account</button>
        </div>

        <div class="admin-section">
            <div class="section-header"><h2>Profile Management</h2></div>
            <div class="action-bar">
                <form id="up-create-form" class="subsection" novalidate>
                    <h3>Create User Profile</h3>
                    <div class="grid-2" style="margin-top:10px;">
                        <div class="form-group">
                            <label>Role Name</label>
                            <input type="text" id="up-role-name" name="roleName" required>
                        </div>
                        <div class="form-group">
                            <label>Initial Status</label>
                            <select id="up-role-status" name="status">
                                <option value="">Select a Status</option>
                                <option value="Active">Active</option>
                                <option value="Suspended">Suspended</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-create">Create</button>
                </form>
            </div>
        </div>

        <div class="admin-section">
            <div class="section-header"><h2>Manage Profiles</h2></div>
            <div class="grid-2" style="margin-bottom: 12px;">
                <div class="form-group">
                    <label>Search Role Name</label>
                    <input id="up-search" type="text" placeholder="e.g. Admin, Fund Raiser">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="up-status">
                        <option value="all">All</option>
                        <option value="active">Active</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
            </div>
            <div class="table-wrap">
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>ID</th><th>Role Name</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="up-tbody"></tbody>
                    </table>
                </div>
                <div style="padding:10px; font-size:12px; color:var(--text-muted);" id="up-count">Showing 0 roles</div>
            </div>
        </div>
    </main>
</div>

<div id="up-backdrop" class="drawer-backdrop"></div>
<aside id="up-drawer" class="drawer">
    <div class="drawer-header">
        <strong id="up-drawer-title">Profile Details</strong>
        <button id="up-close" class="btn btn-muted btn-sm"><i class="ti ti-x"></i> Close</button>
    </div>
    <div class="drawer-body">
        <div class="kv"><div class="k">Profile ID</div><div class="v" id="up-v-id">-</div></div>
        <div class="kv"><div class="k">Role Name</div><div class="v" id="up-v-role">-</div></div>
        <div class="kv"><div class="k">Status</div><div class="v" id="up-v-status">-</div></div>
        <div id="up-edit-form" style="display:none; margin-top:10px; padding:10px; background:#f8fafc; border-radius:8px;">
            <label>Update Role Name</label>
            <input id="up-e-role" type="text">
        </div>
    </div>
    <div class="drawer-footer">
        <button id="up-save" class="btn btn-primary" style="display:none;"><i class="ti ti-check"></i> Save Changes</button>
        <button id="up-toggle" class="btn btn-danger">Suspend</button>
    </div>
</aside>

<div id="up-note-backdrop" class="modal-backdrop"></div>
<div id="up-note-modal" class="modal">
    <div class="modal-header" id="up-note-title">Notice</div>
    <div class="modal-body" id="up-note-message"></div>
    <div class="modal-footer"><button id="up-note-ok" class="btn btn-primary">OK</button></div>
</div>

<div id="up-confirm-backdrop" class="modal-backdrop"></div>
<div id="up-confirm-modal" class="modal">
    <div class="modal-header">Confirm Action</div>
    <div class="modal-body" id="up-confirm-message"></div>
    <div class="modal-footer">
        <button id="up-confirm-cancel" class="btn btn-muted">Cancel</button>
        <button id="up-confirm-yes" class="btn btn-primary">Proceed</button>
    </div>
</div>

<script>
    function showToast(msg, type='success'){
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast-msg toast-${type}`; t.innerText = msg;
        container.appendChild(t);
        setTimeout(() => t.classList.add('show'), 10);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function upNoteOpen(msg, title='Notice'){
        document.getElementById('up-note-title').innerText = title;
        document.getElementById('up-note-message').innerText = msg;
        document.getElementById('up-note-backdrop').classList.add('open');
        document.getElementById('up-note-modal').classList.add('open');
    }
    document.getElementById('up-note-ok').onclick = () => {
        document.getElementById('up-note-backdrop').classList.remove('open');
        document.getElementById('up-note-modal').classList.remove('open');
    };

    let confirmCb = null;
    function upConfirmOpen(msg, cb){
        document.getElementById('up-confirm-message').innerText = msg;
        confirmCb = cb;
        document.getElementById('up-confirm-backdrop').classList.add('open');
        document.getElementById('up-confirm-modal').classList.add('open');
    }
    document.getElementById('up-confirm-cancel').onclick = () => {
        document.getElementById('up-confirm-backdrop').classList.remove('open');
        document.getElementById('up-confirm-modal').classList.remove('open');
    };
    document.getElementById('up-confirm-yes').onclick = () => { if(confirmCb) confirmCb(); 
        document.getElementById('up-confirm-backdrop').classList.remove('open');
        document.getElementById('up-confirm-modal').classList.remove('open');
    };

    function isAdmin(role) { return role.toLowerCase().replace(/\s/g, '') === 'useradmin'; }

    function loadProfiles(){
        const keyword = document.getElementById('up-search').value;
        const status = document.getElementById('up-status').value;
        fetch(`/api/profiles/list?keyword=${encodeURIComponent(keyword)}&status=${status}`)
            .then(r => r.json()).then(data => {
                const tbody = document.getElementById('up-tbody');
                tbody.innerHTML = '';
                data.forEach(p => {
                    const isSusp = p.status.toLowerCase() === 'suspended';
                    const tr = document.createElement('tr');
                    tr.setAttribute('data-status', isSusp ? 'suspended' : 'active');
                    tr.innerHTML = `
                        <td>${p.profileId}</td>
                        <td>${p.roleName}</td>
                        <td><span class="pill ${isSusp?'bad':'ok'}">${p.status}</span></td>
                        <td>
                            <div style="display:flex; gap:5px;">
                                <button class="btn btn-view btn-sm" data-action="edit">Update</button>
                                <button class="btn ${isSusp?'btn-muted':'btn-danger'} btn-sm" data-action="toggle">${isSusp?'Re-activate':'Suspend'}</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('up-count').innerText = `Showing ${data.length} roles`;
            });
    }

    function openDrawer(mode, row){
        const cells = row.cells;
        document.getElementById('up-v-id').innerText = cells[0].innerText;
        document.getElementById('up-v-role').innerText = cells[1].innerText;
        document.getElementById('up-v-status').innerText = cells[2].innerText;
        document.getElementById('up-e-role').value = cells[1].innerText;
        document.getElementById('up-edit-form').style.display = mode === 'edit' ? 'block' : 'none';
        document.getElementById('up-save').style.display = mode === 'edit' ? 'inline-flex' : 'none';
        
        const isSusp = row.getAttribute('data-status') === 'suspended';
        const toggleBtn = document.getElementById('up-toggle');
        toggleBtn.innerHTML = isSusp ? '<i class="ti ti-check"></i> Re-activate' : '<i class="ti ti-ban"></i> Suspend';
        toggleBtn.className = isSusp ? 'btn btn-muted' : 'btn btn-danger';
        
        document.getElementById('up-backdrop').classList.add('open');
        document.getElementById('up-drawer').classList.add('open');
    }

    document.getElementById('up-close').onclick = () => {
        document.getElementById('up-backdrop').classList.remove('open');
        document.getElementById('up-drawer').classList.remove('open');
    };

    // --- 这里是修复详情页按钮的关键代码 ---
    document.getElementById('up-toggle').onclick = () => {
        const id = document.getElementById('up-v-id').innerText;
        const role = document.getElementById('up-v-role').innerText;
        const isSusp = document.getElementById('up-v-status').innerText.toLowerCase() === 'suspended';

        if(!isSusp && isAdmin(role)){
            upNoteOpen('User Admin cannot be suspended.'); return;
        }

        const action = isSusp ? 'reactivate' : 'suspend';
        upConfirmOpen(`Confirm ${action} for ${role}?`, () => {
            fetch(`/api/profiles/${action}/${id}`, {method:'POST'}).then(r=>r.text()).then(res => {
                if(res === 'true'){ showToast('Success'); loadProfiles(); 
                    document.getElementById('up-backdrop').classList.remove('open');
                    document.getElementById('up-drawer').classList.remove('open');
                }
            });
        });
    };

    document.getElementById('up-tbody').onclick = (e) => {
        const btn = e.target.closest('button'); if(!btn) return;
        const row = btn.closest('tr');
        const act = btn.getAttribute('data-action');
        if(act === 'edit') openDrawer('edit', row);
        if(act === 'toggle'){
            const id = row.cells[0].innerText;
            const role = row.cells[1].innerText;
            const isSusp = row.getAttribute('data-status') === 'suspended';
            if(!isSusp && isAdmin(role)) { upNoteOpen('User Admin cannot be suspended.'); return; }
            const action = isSusp ? 'reactivate' : 'suspend';
            upConfirmOpen(`Confirm ${action}?`, () => {
                fetch(`/api/profiles/${action}/${id}`, {method:'POST'}).then(r=>r.text()).then(res => {
                    if(res === 'true') { showToast('Success'); loadProfiles(); }
                });
            });
        }
    };

    document.getElementById('up-create-form').onsubmit = function(e){
        e.preventDefault();
        const role = document.getElementById('up-role-name').value;
        const status = document.getElementById('up-role-status').value;
        const params = new URLSearchParams({roleName:role, status:status});
        fetch('/api/profiles/create', {method:'POST', body:params}).then(r=>r.text()).then(res => {
            if(res === 'true') { showToast('Created'); loadProfiles(); this.reset(); }
            else if(res === 'duplicate') upNoteOpen('Role name exists');
        });
    };

    document.getElementById('up-save').onclick = () => {
        const id = document.getElementById('up-v-id').innerText;
        const name = document.getElementById('up-e-role').value;
        const params = new URLSearchParams({newRoleName:name});
        fetch(`/api/profiles/update-role/${id}`, {method:'POST', body:params}).then(r=>r.text()).then(res => {
            if(res === 'true') { showToast('Updated'); loadProfiles(); 
                document.getElementById('up-backdrop').classList.remove('open');
                document.getElementById('up-drawer').classList.remove('open');
            }
        });
    };

    document.getElementById('up-search').oninput = loadProfiles;
    document.getElementById('up-status').onchange = loadProfiles;
    window.onload = loadProfiles;
</script>
</body>
</html>
