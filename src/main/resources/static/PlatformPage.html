<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Management Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <style>
        :root {
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --surface-tint: #f1f5f9;
            --border: rgba(16, 185, 129, 0.18);
            --border-soft: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #059669;
            --accent-hover: #047857;
            --accent-bright: #10b981;
            --accent-light: #d1fae5;
            --accent-soft: #a7f3d0;
            --accent-ring: rgba(16, 185, 129, 0.28);
            --danger-soft: #fef2f2;
            --shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.1);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
            --head-fg: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body { min-height: 100vh; color: var(--text); background: #f8fafc; }

        .container { min-height: 100vh; }
        .main-content { padding: 20px; max-width: 1560px; margin: 0 auto; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 16px 26px;
            border-radius: 14px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-soft);
            border-left: 4px solid var(--accent);
        }
        .topbar-user { font-size: 13px; color: #94a3b8; display: inline-flex; align-items: center; gap: 8px; }
        .topbar-user::before {
            content: "PM"; width: 34px; height: 34px; border-radius: 999px;
            background: #d1fae5; color: #047857; display: inline-flex;
            align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: .03em;
        }
        .topbar-user strong { color: #047857; font-size: 14px; font-weight: 500; }

        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .nav-btn {
            width: 42px; height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .nav-btn:hover {
            background: #fff;
            border-color: var(--accent-soft);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.15);
        }
        .nav-btn:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }
        .nav-icon {
            width: 18px; height: 12px; position: relative;
        }
        .nav-icon span {
            position: absolute; left: 0; right: 0;
            height: 2px; background: #047857; border-radius: 999px;
        }
        .nav-icon span:nth-child(1) { top: 0; }
        .nav-icon span:nth-child(2) { top: 5px; }
        .nav-icon span:nth-child(3) { top: 10px; }

        .logout-btn {
            border: 1px solid #fecdd3; color: #f43f5e; background: #fff1f2;
            padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 500;
            transition: background 0.2s, color 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .logout-btn:hover { background: #ffe4e6; }

        .admin-section {
            background: #fff;
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-soft);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: .8rem;
        }
        h2 { font-size: 16px; color: #334155; font-weight: 600; letter-spacing: .01em; }

        .subsection {
            padding: 18px;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            background: #f8fafc;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .subsection h3 { font-size: 15px; margin-bottom: 10px; color: #065f46; font-weight: 700; white-space: nowrap; }

        .cm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
            align-items: stretch;
        }
        .cm-grid .subsection { display: flex; flex-direction: column; min-width: 0; }
        .cm-grid form { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .cm-card-body { flex: 1; min-height: 0; }
        .cm-actions { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: auto; padding-top: 12px; width: 100%; }
        .cm-form-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
        .cm-form-grid .form-group { min-width: 0; }
        .cm-form-grid input, .cm-form-grid select { min-width: 0; }

        .form-group { margin-bottom: 0; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; white-space: nowrap; overflow: visible; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-bright);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
        }
        .btn:active { transform: translateY(1px); }
        .btn-black {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
        }
        .btn-black:hover {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
        }
        .btn-view {
            background: var(--accent-light);
            color: #065f46;
            border: 1px solid var(--accent-soft);
            font-weight: 600;
        }
        .btn-view:hover {
            background: #ecfdf5;
            border-color: #6ee7b7;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.38);
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 100%);
        }
        .btn-muted {
            background: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-muted:hover { background: #cbd5e1; }
        .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 8px; }

        .pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 0; font-weight: 600; }
        .pill::before { content: ''; width: 5px; height: 5px; border-radius: 999px; display: inline-block; }
        .pill.ok { background: #dcfce7; color: #15803d; }
        .pill.ok::before { background: #22c55e; }
        .pill.bad { background: #fee2e2; color: #dc2626; }
        .pill.bad::before { background: #ef4444; }

        .muted { color: var(--text-muted); font-size: 12px; }

        .table-wrap {
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
        }
        .table-scroll { max-height: 800px; overflow: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 980px; }
        thead th {
            position: sticky; top: 0; z-index: 1;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-soft);
            font-size: 11px; letter-spacing: 0.07em;
            text-transform: uppercase; color: #94a3b8;
            font-weight: 600;
            padding: 13px 12px;
            text-align: left; white-space: nowrap;
        }
        tbody td {
            padding: 12px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #1e293b;
            vertical-align: middle;
            background: #fff;
        }
        tbody tr:hover td { background: #fafbff; }

        .td-actions { display: inline-flex; gap: 8px; flex-wrap: nowrap; align-items: center; justify-content: center; width: 100%; }

        .pagination {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 12px 14px;
            gap: 12px;
            border-top: 1px solid var(--border-soft);
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; z-index: 1200; }
        .modal-backdrop.open { display: block; }
        .modal {
            position: fixed; left: 50%; top: 8%; transform: translateX(-50%);
            width: min(640px, 92vw); max-height: 88vh; background: #fff;
            border: 1px solid var(--border-soft); border-radius: 14px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            display: none; z-index: 1210; overflow: hidden;
        }
        .modal.open { display: block; }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            background: #fafafa;
            border-bottom: 1px solid var(--border-soft);
        }
        .modal-header strong { font-size: 16px; color: #0f172a; font-weight: 700; }
        .modal-body { padding: 18px 20px; font-size: 15px; line-height: 1.55; color: #1e293b; word-break: break-word; overflow: auto; max-height: calc(88vh - 56px - 64px); background: #fff; }
        .modal-footer {
            padding: 14px 20px; border-top: 1px solid var(--border-soft);
            display: flex; justify-content: flex-end; gap: 10px;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 1100;
            background: #064e3b;
            color: #fff;
            border-radius: 10px;
            padding: 12px 18px;
            box-shadow: 0 10px 40px rgba(6, 78, 59, 0.2);
            display: none;
            max-width: min(520px, 92vw);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.35;
            border: 1px solid rgba(167, 243, 208, 0.4);
        }
        .toast.open { display: block; }
        .toast.bad { background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%); border-color: rgba(252, 165, 165, 0.4); }
        .toast.ok { background: linear-gradient(135deg, #047857 0%, #064e3b 100%); border-color: rgba(167, 243, 208, 0.45); }

        .nav-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); display: none; z-index: 2100; }
        .nav-backdrop.open { display: block; }
        .nav-drawer {
            position: fixed;
            width: min(280px, calc(100vw - 24px));
            max-width: 280px;
            background: #fff;
            border: 1px solid var(--border-soft);
            border-left: 3px solid var(--accent);
            border-radius: 14px;
            box-shadow: var(--shadow);
            z-index: 2110;
            display: none;
            overflow: hidden;
        }
        .nav-drawer.open { display: block; }
        .nav-drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border-bottom: 1px solid var(--border-soft);
        }
        .nav-drawer-header strong { font-size: 14px; color: #065f46; font-weight: 700; }
        .nav-close {
            border: 1px solid var(--border-soft);
            background: #fff;
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 700;
            color: #334155;
            transition: border-color 0.2s, background 0.2s;
        }
        .nav-close:hover {
            border-color: var(--accent-soft);
            background: var(--accent-light);
        }
        .nav-list { padding: 10px; display: grid; gap: 8px; }
        .nav-item {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            color: #334155;
            transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .nav-item.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.28);
        }
        .nav-item:hover { background: #ecfdf5; border-color: var(--accent-soft); color: #047857; }
        .nav-item.active:hover {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: #fff;
        }

        .report-grid { display: block; min-width: 0; }
        .report-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        .report-stat { border: 1px solid var(--border-soft); border-radius: 10px; background: #fff; padding: 14px 16px; }
        .report-stat-key { color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }
        .report-stat-val { font-size: 26px; font-weight: 700; }
        .report-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
        .report-chart-card { border: 1px solid var(--border-soft); border-radius: 10px; background: #fff; padding: 14px 16px; min-width: 0; overflow: hidden; }
        .report-chart-title { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .report-canvas { position: relative; height: 320px; min-width: 0; }
        .report-canvas.scroll-y { overflow-y: auto; }
        .report-error { display:none; margin-bottom:10px; border:1px solid #fecaca; background:#fef2f2; color:#991b1b; border-radius:10px; padding:8px 10px; font-size:13px; }

        @media (max-width: 980px) {
            .report-stats { grid-template-columns: 1fr 1fr; }
            .report-charts { grid-template-columns: 1fr; }
            table { min-width: 0; width: 100%; table-layout: fixed; }
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tbody tr { background: #fff; border: 1px solid var(--border-soft); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
            tbody td { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 8px 0; white-space: normal; word-break: break-word; text-align: right; }
            tbody td:last-child { border-bottom: none; }
            tbody td::before { color: var(--text-muted); font-weight: 600; text-align: left; padding-right: 8px; flex: 0 0 44%; }
            #fra-list-table tbody td:nth-child(1)::before { content: "Category ID"; }
            #fra-list-table tbody td:nth-child(2)::before { content: "Category Name"; }
            #fra-list-table tbody td:nth-child(3)::before { content: "Category Status"; }
            #fra-list-table tbody td:nth-child(4)::before { content: "Action"; }
        }
    </style>
</head>
<body>
<div class="container">
    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button id="nav-open" class="nav-btn" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="nav-drawer">
                    <span class="nav-icon" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </span>
                </button>
                <span class="topbar-user">Logged in as: <strong>Platform Management</strong></span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </div>

        <div id="view-dashboard" class="admin-section">
            <div class="section-header">
                <h2>Category Management</h2>
            </div>
            
            <div class="cm-grid">
                <div class="subsection">
                    <h3>Create Category</h3>
                    <form id="fra-create-form" action="#" method="post" novalidate>
                        <div class="cm-card-body">
                            <div class="cm-form-grid" style="margin-top:10px;">
                                <div class="form-group">
                                    <label>Category Name</label>
                                    <input type="text" name="categoryName" required pattern=".*\\S.*"/>
                                </div>
                                <div class="form-group">
                                    <label>Category Status</label>
                                    <select name="categoryStatus" required>
                                        <option value="Active" selected>Active</option>
                                        <option value="Suspended">Suspended</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="cm-actions">
                            <button type="submit" class="btn btn-black">Create</button>
                        </div>
                    </form>
                </div>

                <div class="subsection">
                    <h3>Search Categories</h3>
                    <div class="cm-card-body">
                        <div class="cm-form-grid">
                            <div class="form-group">
                                <label>Keyword</label>
                                <input id="fra-search-q" type="text"/>
                            </div>
                            <div class="form-group">
                                <label>Category Status</label>
                                <select id="fra-filter-status">
                                    <option value="" selected>All</option>
                                    <option value="Active">Active</option>
                                    <option value="Suspended">Suspended</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="cm-actions">
                        <button id="fra-search-btn" type="button" class="btn btn-black">Search</button>
                        <button id="fra-search-clear" type="button" class="btn btn-muted">Clear</button>
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <div class="table-scroll">
                    <table id="fra-list-table" aria-label="FRA categories list">
                        <thead>
                        <tr>
                            <th style="width: 120px;">Category ID</th>
                            <th style="width: 420px;">Category Name</th>
                            <th style="width: 220px;">Category Status</th>
                            <th style="width: 220px; text-align: center;">Action</th>
                        </tr>
                        </thead>
                        <tbody id="fra-list-tbody">
                        <tr>
                            <td colspan="4" class="muted" style="text-align: center;">Loadingâ€¦</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <div class="muted" id="fra-count">â€”</div>
                </div>
            </div>
        </div>
        
        <div id="view-report" class="admin-section" style="display:none;">
            <div class="section-header">
                <h2 id="report-title">Report</h2>
            </div>
            <div id="report-error" class="report-error"></div>
            <div class="report-grid">
                <div class="subsection">
                    <h3>User Stats</h3>
                    <div class="report-stats">
                        <div class="report-stat"><div class="report-stat-key">Total Users</div><div class="report-stat-val" id="rep-user-total">0</div></div>
                        <div class="report-stat"><div class="report-stat-key">Active Users</div><div class="report-stat-val" id="rep-user-active">0</div></div>
                        <div class="report-stat"><div class="report-stat-key">Suspended Users</div><div class="report-stat-val" id="rep-user-suspended">0</div></div>
                    </div>
                    <div class="report-charts">
                        <div class="report-chart-card">
                            <div class="report-chart-title">Active vs Suspended</div>
                            <div class="report-canvas"><canvas id="rep-user-status-chart"></canvas></div>
                        </div>
                        <div class="report-chart-card">
                            <div class="report-chart-title">User Count per Role</div>
                            <div class="report-canvas"><canvas id="rep-user-role-chart"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>
<div id="nav-drawer" class="nav-drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <div class="nav-drawer-header">
        <strong>Menu</strong>
        <button id="nav-close" type="button" class="nav-close" aria-label="Close menu">X</button>
    </div>
    <div class="nav-list">
        <button class="nav-item active" type="button" data-view="dashboard">Dashboard</button>
        <button class="nav-item" type="button" data-view="daily">Daily report</button>
        <button class="nav-item" type="button" data-view="weekly">Weekly report</button>
        <button class="nav-item" type="button" data-view="monthly">Monthly report</button>
    </div>
</div>

<div id="fra-modal-backdrop" class="modal-backdrop"></div>
<div id="fra-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
        <strong id="fra-modal-title">Category Detail</strong>
    </div>
    <div id="fra-modal-body" class="modal-body"></div>
    <div class="modal-footer">
        <button id="fra-modal-save" type="button" class="btn btn-muted" style="display:none;">Save</button>
        <button id="fra-modal-ok" type="button" class="btn btn-black">OK</button>
    </div>
</div>

<div id="fra-toast" class="toast" role="status" aria-live="polite"></div>

<script>
    const fraState = {
        searchQuery: '',
        searchStatus: ''
    };
    const reportState = {
        userStatusChart: null,
        userRoleChart: null,
        loadedPeriod: ''
    };

    function fraEscapeHtml(s) {
        return String(s ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function fraOpenModal(title, html, showSave) {
        document.getElementById('fra-modal-title').textContent = title || 'Category Detail';
        const body = document.getElementById('fra-modal-body');
        body.innerHTML = html || '';

    function fraToast(message, kind) {
        const el = document.getElementById('fra-toast');
        if (!el) return;
        el.textContent = String(message ?? '');
        el.className = 'toast open ' + (kind === 'bad' ? 'bad' : (kind === 'ok' ? 'ok' : ''));
        clearTimeout(window.__fraToastTimer);
        window.__fraToastTimer = setTimeout(() => {
            el.classList.remove('open');
        }, 1800);
    }

    function fraShowToastFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('toast');
        if (!msg) return;
        fraOpenModal(msg.toLowerCase().startsWith('success') ? 'Success' : 'Notice', `<div>${fraEscapeHtml(msg)}</div>`, false);
        params.delete('toast');
        const next = params.toString();
        const url = window.location.pathname + (next ? `?${next}` : '');
        window.history.replaceState({}, '', url);
    }

    async function loadFraCategories() {
        const tbody = document.getElementById('fra-list-tbody');
        const count = document.getElementById('fra-count');
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#667085;">Loadingâ€¦</td></tr>`;
        try {
            const q = (fraState.searchQuery || '').trim();
            const st = (fraState.searchStatus || '').trim();
            const url = `/api/fra-categories/search?categoryName=${encodeURIComponent(q)}&categoryStatus=${encodeURIComponent(st)}`;
            const r = await fetch(url, { credentials: 'same-origin' });
            if (!r.ok) throw new Error('Failed to load categories');
            const rows = await r.json();
            const safeRows = Array.isArray(rows) ? rows : [];
            if (safeRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#667085;">No categories found.</td></tr>`;
                count.textContent = `Showing 0 categories`;
                return;
            }

            tbody.innerHTML = safeRows.map(c => {
                const id = c.categoryID ?? c.categoryId ?? '';
                const name = fraEscapeHtml(c.categoryName ?? '');
                const rawStatus = String(c.categoryStatus ?? '');
                const status = fraEscapeHtml(rawStatus);
                const isSuspended = rawStatus.toLowerCase() === 'suspended';
                const pillClass = isSuspended ? 'pill bad' : 'pill ok';
                const toggleLabel = isSuspended ? 'Re-activate' : 'Suspend';
                const toggleClass = isSuspended ? 'btn-muted' : 'btn-danger';
                return `
                    <tr data-status="${isSuspended ? 'suspended' : 'active'}">
                        <td>${fraEscapeHtml(id)}</td>
                        <td>${name}</td>
                        <td><span class="${pillClass}">${status || (isSuspended ? 'Suspended' : 'Active')}</span></td>
                        <td style="text-align:center;">
                            <div class="td-actions">
                                <button type="button" class="btn btn-view btn-sm" data-action="view" data-category-id="${fraEscapeHtml(id)}">View</button>
                                <button type="button" class="btn btn-sm ${toggleClass}" data-action="toggle-status" data-category-id="${fraEscapeHtml(id)}">${fraEscapeHtml(toggleLabel)}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            count.textContent = `Showing ${safeRows.length} categories`;
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#667085;">Failed to load categories.</td></tr>`;
            count.textContent = 'â€”';
            fraOpenModal('Notice', `Failed to load categories from database. ${fraEscapeHtml(e?.message || '')}`, false);
        }
    }

    async function saveFraCategoryDetail(categoryID) {
        if (!categoryID) return;
        const name = (document.getElementById('fra-edit-name')?.value || '').trim();
        const status = (document.getElementById('fra-edit-status')?.value || '').trim();
        try {
            const errEl = document.getElementById('fra-edit-error');
            if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
            const saveBtn = document.getElementById('fra-modal-save');
            saveBtn.disabled = true;

            // ã€æ ¸å¿ƒä¿®å¤ 1ã€‘æŠŠæ›´æ–°çš„æ•°æ®æ‰“åŒ…æˆæ ‡å‡†çš„ JSON å­—å…¸
            const payload = {
                categoryId: categoryID,
                categoryName: name,
                categoryStatus: status
            };

            // ã€æ ¸å¿ƒä¿®å¤ 2ã€‘æŠŠå‚æ•°æ‹¼åœ¨ URL çš„è€æ–¹æ³•åˆ æŽ‰ï¼Œæ¢æˆæ ‡å‡†çš„ application/json æ ¼å¼å‘é€
            const r = await fetch('/api/fra-categories/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json;charset=UTF-8' },
                credentials: 'same-origin',
                body: JSON.stringify(payload)
            });
            
            const resp = await r.json().catch(() => null);
            
            if (!r.ok || resp !== true) {
                const errorMessage = (resp && resp.error) ? resp.error : `HTTP ${r.status || 'Update failed.'}`;
                throw new Error(errorMessage);
            }
            
            fraCloseModal();
            await loadFraCategories();
            fraToast('Category updated.', 'ok');
        } catch (e) {
            const errEl = document.getElementById('fra-edit-error');
            const msg = String(e?.message || 'Update failed'); 
            if (errEl) {
                errEl.textContent = `${msg}`;
                errEl.style.display = 'block';
            } else {
                fraToast(`${msg}`, 'bad');
            }
        } finally {
            const saveBtn = document.getElementById('fra-modal-save');
            if(saveBtn) saveBtn.disabled = false;
        }
    }

    function reportToNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
    }

    function reportDestroy(chartRef) {
        if (chartRef && typeof chartRef.destroy === 'function') chartRef.destroy();
    }

    function reportShowError(message) {
        const box = document.getElementById('report-error');
        if (!box) return;
        box.style.display = message ? 'block' : 'none';
        box.textContent = message || '';
    }

    function reportRenderUserCharts(userStats) {
        const active = reportToNumber(userStats.activeCount);
        const suspended = reportToNumber(userStats.suspendedCount);
        const byRole = Array.isArray(userStats.userByRole) ? userStats.userByRole : [];
        const userRoleWrap = document.getElementById('rep-user-role-chart')?.parentElement;
        if (userRoleWrap) {
            userRoleWrap.classList.add('scroll-y');
            userRoleWrap.style.height = `${Math.max(260, byRole.length * 30 + 80)}px`;
        }

        reportDestroy(reportState.userStatusChart);
        reportState.userStatusChart = new Chart(document.getElementById('rep-user-status-chart'), {
            type: 'pie',
            data: {
                labels: ['Active', 'Suspended'],
                datasets: [{ data: [active, suspended], backgroundColor: ['#3b82f6', '#ef4444'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        reportDestroy(reportState.userRoleChart);
        reportState.userRoleChart = new Chart(document.getElementById('rep-user-role-chart'), {
            type: 'bar',
            data: {
                labels: byRole.map(x => String(x.roleName || 'Unknown')),
                datasets: [{ label: 'User Count', data: byRole.map(x => reportToNumber(x.count)), backgroundColor: '#60a5fa' }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { beginAtZero: true, ticks: { precision: 0 } },
                    y: { ticks: { autoSkip: false } }
                }
            }
        });
    }

    function reportRenderStats(data) {
        const userStats = data && data.userStats ? data.userStats : {};
        document.getElementById('rep-user-total').textContent = String(reportToNumber(userStats.totalUserCount));
        document.getElementById('rep-user-active').textContent = String(reportToNumber(userStats.activeCount));
        document.getElementById('rep-user-suspended').textContent = String(reportToNumber(userStats.suspendedCount));
        reportRenderUserCharts(userStats);
    }

    async function loadReport(period) {
        reportShowError('');
        if (typeof Chart === 'undefined') {
            reportShowError('Chart library failed to load.');
            return;
        }
        try {
            const r = await fetch(`/api/report/${encodeURIComponent(period)}`, { credentials: 'same-origin' });
            if (!r.ok) throw new Error('Failed to load report.');
            const data = await r.json();
            reportRenderStats(data || {});
            reportState.loadedPeriod = period;
        } catch (e) {
            reportShowError(`Unable to load report: ${String(e?.message || 'Unknown error')}`);
        }
    }

            const gap = 8;

            if (left + maxW > window.innerWidth - 12) {

            if (left < 12) left = 12;
            const top = r.bottom + gap;
            drawer.style.top = `${Math.round(top)}px`;

            if (e.key !== 'Enter') return;
            e.preventDefault();
            document.getElementById('fra-search-btn')?.click();
        }
        document.getElementById('fra-search-q')?.addEventListener('keydown', fraTriggerSearchOnEnter);
        document.getElementById('fra-filter-status')?.addEventListener('keydown', fraTriggerSearchOnEnter);
        document.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;
            const modal = document.getElementById('fra-modal');
            const save = document.getElementById('fra-modal-save');
            const isOpen = modal?.classList.contains('open');
            const canSave = isOpen && save && save.style.display !== 'none' && !save.disabled;
            if (!canSave) return;
            const active = document.activeElement;
            if (active && (active.id === 'fra-edit-name' || active.id === 'fra-edit-status' || active === save)) {
                e.preventDefault();
                save.click();
            }
        });
    });

    async function viewMyAccount() {
        try {
            const r = await fetch('/api/accounts/view', { credentials: 'same-origin' });
            const d = await r.json().catch(() => ({}));
            if (!r.ok || d?.error) throw new Error(d?.error || 'Failed');
            const rows = [['Username', d.username ?? '-'], ['Full Name', d.full_name ?? '-'], ['Email', d.email ?? '-'], ['Phone Number', d.phone_number ?? '-'], ['Account Status', d.a_status ?? '-'], ['Role', d.roleName ?? '-']];
            const tableHtml = `<div class="table-wrap"><table style="min-width:0;" aria-label="My account detail"><thead><tr><th style="width:180px;">Field</th><th>Value</th></tr></thead><tbody>${rows.map(([k,v]) => `<tr><td class="muted" style="font-weight:600;">${fraEscapeHtml(k)}</td><td>${fraEscapeHtml(String(v))}</td></tr>`).join('')}</tbody></table></div>`;
            fraOpenModal('My Account', tableHtml, false);
        } catch (e) { fraOpenModal('Notice', '<p>Failed to load your account information.</p>', false); }
    }
</script>
</body>
</html>
